# MathRAG MCP Server - Configuration
# API keys: set DASHSCOPE_API_KEY (Qwen/DashScope) or OPENAI_API_KEY in .env or environment.
# Copy .env.example → .env and fill in your key. Do NOT commit .env or put secrets here.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "qwen"  # Options: openai, azure, ollama, deepseek, qwen
  model: "qwen-max"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "qwen"  # Options: openai, azure, ollama, qwen
  model: "text-embedding-v3"
  dimensions: 1024
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: "qwen"  # Options: openai, azure, ollama, qwen
  model: "qwen-vl-max"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "default"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant
  dense_rrf_weight: 1.0   # RRF weight for dense list (Phase 1b: e.g. 0.3–0.7)
  sparse_rrf_weight: 1.0  # RRF weight for BM25 list

# =============================================================================
# Answer Generation Configuration
# =============================================================================
generation:
  # Production prompt: v3.4 (boundary rejection + anti-hallucination). Legacy v1: answer_generation.txt
  prompt_path: "./config/prompts/answer_generation_v3.4.txt"

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "llm"  # Options: none, cross_encoder, llm
  model: "qwen-max"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "ragas"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: hierarchical, recursive
  batch_size: 10
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true

  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true
